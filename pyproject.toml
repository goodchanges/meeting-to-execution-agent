[project]
name = "meetflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn>=0.40,<1", "sqlalchemy>=2,<3",
  "alembic>=1.17,<2", "httpx>=0.28,<1", "apscheduler>=3.11,<4",
  "argon2-cffi>=25,<26", "pydantic-settings>=2.12,<3", "python-multipart>=0.0.26,<1",
  "email-validator>=2.2,<3", "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15", "mypy>=1.19", "pip-audit>=2.10"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true

