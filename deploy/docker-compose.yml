services:
  meetflow:
    image: meetflow:${MEETFLOW_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${MEETFLOW_TAG:-local}
    env_file:
      - ../.env
    environment:
      DB_PATH: /data/meetflow.sqlite
      BACKUP_DIR: /data/backups
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - meeting-data:/data

volumes:
  meeting-data:
